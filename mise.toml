[tools]
zig = "0.17.1"
hk = "2.12.0"
pkl = "0.32.2"
lua = { version = "5.5.1", postinstall = "luarocks install --dev luacheck" }

[tasks.build]
description = "Build huen-wm"
run = "zig build"

[tasks.test]
description = "Run the manager-seam cases, one process per case, and the pure-module tests"
run = "zig build test"

[tasks.install]
description = "Build, sign and install the app, the huen-wm command, and a starter config"
run = "sh scripts/bundle.sh --install"

[tasks.check]
description = "Check authored source formatting, names, and Lua syntax"
run = "hk check --all"

[tasks.fmt]
description = "Format authored Zig sources and check names"
run = "hk fix --all"

[tasks.smoke]
description = "Run headless checks of the CLI, configuration, and socket client"
run = "zig build smoke"

[tasks.login]
description = "Enable, disable, or report login startup: mise run login enable|disable|status"
run = "zig build login --"

[tasks.native-smoke]
description = "Check native fixture windows against the installed manager; see docs/native-smoke.md"
run = "zig build native-smoke --"
