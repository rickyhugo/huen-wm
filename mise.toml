[tools]
zig = "0.17.0"
hk = "2.9.0"
pkl = "0.32.2"
lua = "5.5.1"

[tasks.build]
description = "Build huen-wm"
run = "zig build"

[tasks.check]
description = "Check authored source formatting, names, and Lua syntax"
run = "hk check --all"

[tasks.fmt]
description = "Format authored Zig sources and check names"
run = "hk fix --all"
